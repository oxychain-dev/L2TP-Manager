# L2TP Manager Configuration File
# Made by Mostech
# GitHub: https://github.com/safrinnetwork/

# Colors for output
export RED='\033[0;31m'
export GREEN='\033[0;32m'
export YELLOW='\033[1;33m'
export BLUE='\033[0;34m'
export PURPLE='\033[0;35m'
export CYAN='\033[0;36m'
export NC='\033[0m' # No Color

# Configuration file paths
export L2TP_CONFIG="/etc/xl2tpd/xl2tpd.conf"
export PPP_CONFIG="/etc/ppp/options.xl2tpd"
export CHAP_SECRETS="/etc/ppp/chap-secrets"
export FORWARDS_CONFIG="/etc/l2tp-forwards.conf"
export SERVICE_FILE="/etc/systemd/system/l2tp-forwards.service"

# Network configuration - lazy loaded
# PUBLIC_IP and DEFAULT_INTERFACE are set by core.sh init_network_vars()
# to avoid blocking on curl when config is sourced
export PUBLIC_IP="${PUBLIC_IP:-}"
export DEFAULT_INTERFACE="${DEFAULT_INTERFACE:-}"

# VPN defaults: override through /etc/l2tp-manager/network.conf.
export VPN_SUBNET="${VPN_SUBNET:-172.16.101.0/24}"
export VPN_IP_START="${VPN_IP_START:-172.16.101.10}"
export VPN_IP_END="${VPN_IP_END:-172.16.101.100}"
export VPN_LOCAL_IP="${VPN_LOCAL_IP:-172.16.101.1}"
export VPN_MTU="${VPN_MTU:-1280}"
export VPN_MRU="${VPN_MRU:-1280}"
export VPN_DNS1="${VPN_DNS1:-8.8.8.8}"
export VPN_DNS2="${VPN_DNS2:-8.8.4.4}"

export L2TP_PORT="${L2TP_PORT:-1701}"
export IPSEC_PORT_500="500"
export IPSEC_PORT_4500="4500"

# Optional root-owned plain key=value overrides (no shell execution).
_l2tp_load_network_config() {
    local cfg=/etc/l2tp-manager/network.conf line key value uid mode
    [[ -e "$cfg" ]] || return 0
    if [[ ! -f "$cfg" || -L "$cfg" ]]; then
        echo "Unsafe network configuration file: $cfg" >&2
        return 1
    fi
    uid=$(stat -c %u -- "$cfg") || return 1
    mode=$(stat -c %a -- "$cfg") || return 1
    if [[ "$uid" != 0 || ! "$mode" =~ ^[0-7]{3,4}$ ]] ||
       (( (8#$mode & 0022) != 0 )); then
        echo "Network config must be root-owned and not group/world writable" >&2
        return 1
    fi
    while IFS= read -r line || [[ -n "$line" ]]; do
        [[ "$line" =~ ^[[:space:]]*(#|$) ]] && continue
        if [[ ! "$line" =~ ^(VPN_SUBNET|VPN_IP_START|VPN_IP_END|VPN_LOCAL_IP|VPN_MTU|VPN_MRU|VPN_DNS1|VPN_DNS2|L2TP_PORT)=([0-9./]+)$ ]]; then
            echo "Invalid network config entry in $cfg" >&2
            return 1
        fi
        key=${BASH_REMATCH[1]}
        value=${BASH_REMATCH[2]}
        printf -v "$key" '%s' "$value"
        export "$key"
    done < "$cfg"
}
_l2tp_load_network_config || exit 1
unset -f _l2tp_load_network_config
